name: Build Little Me APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          fi
          test -x "$SDKMANAGER"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test simulation
        run: |
          mkdir -p /tmp/littleme-test
          javac -d /tmp/littleme-test app/src/main/java/com/littleme/wallpaper/World.java tests/WorldTest.java tests/WorldInteractionTest.java tests/WorldV3Test.java tests/WorldV31Test.java tests/WorldPaceTest.java tests/WorldWakeTest.java tests/WorldAnchorTest.java tests/HouseholdTest.java
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldTest
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldInteractionTest
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldV3Test
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldV31Test
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldPaceTest
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldWakeTest
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldAnchorTest
          java -cp /tmp/littleme-test com.littleme.wallpaper.HouseholdTest
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk LittleMe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LittleMe-APK
          path: LittleMe.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" LittleMe.apk --title "Little Me build ${GITHUB_RUN_NUMBER}" --notes 'v0.4.0 Little Us: household sprite, balanced scene rotation, opt-in home/away detection and optional relay. Debug-signed.'
