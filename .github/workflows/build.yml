name: Build Little Me APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test simulation
        run: |
          mkdir -p /tmp/littleme-test
          javac -d /tmp/littleme-test app/src/main/java/com/littleme/wallpaper/World.java tests/WorldTest.java
          java -cp /tmp/littleme-test com.littleme.wallpaper.WorldTest
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk LittleMe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LittleMe-APK
          path: LittleMe.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" LittleMe.apk --title "Little Me build ${GITHUB_RUN_NUMBER}" --notes 'Debug-signed Android live wallpaper preview.'
